# Microservicio de usuarios - PocketLaw
server.port=8081
server.address=0.0.0.0

# Base de datos H2 en archivo (se conserva al reiniciar).
# Para usar MySQL: cambiar la dependencia h2 por mysql-connector-j y reemplazar estas 4 líneas.
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
